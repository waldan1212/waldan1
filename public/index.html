<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotspotNet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue:    #3b82f6;
            --blue-dk: #2563eb;
            --cyan:    #06b6d4;
            --purple:  #8b5cf6;
            --bg:      #060612;
            --border:  rgba(99,179,237,0.1);
            --text:    #f0f4ff;
            --muted:   #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(59,130,246,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 30% at 50% 50%, rgba(6,182,212,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Grid lines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(99,179,237,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,179,237,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .splash {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Logo */
        .logo-ring {
            position: relative;
            width: 96px; height: 96px;
            margin-bottom: 32px;
        }
        .logo-ring svg {
            position: absolute;
            inset: 0;
            animation: rotate 3s linear infinite;
        }
        @keyframes rotate { to { transform: rotate(360deg); } }

        .logo-inner {
            position: absolute;
            inset: 12px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow:
                0 0 32px rgba(59,130,246,0.35),
                0 0 60px rgba(139,92,246,0.2);
        }

        .brand-name {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #93c5fd, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 44px;
            letter-spacing: 0.3px;
        }

        /* Progress bar */
        .progress-track {
            width: 180px;
            height: 3px;
            background: rgba(99,179,237,0.1);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            border-radius: 99px;
            animation: load 1.6s ease-in-out forwards;
        }
        @keyframes load {
            0%   { width: 0%; }
            60%  { width: 75%; }
            100% { width: 100%; }
        }

        .status-text {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.4px;
        }

        /* Bottom links */
        .bottom-links {
            position: fixed;
            bottom: 28px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .bottom-links a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(99,179,237,0.1);
        }
        .bottom-links a:hover {
            color: #93c5fd;
            border-color: rgba(99,179,237,0.3);
            background: rgba(59,130,246,0.06);
        }
        .bottom-links span { color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="splash">
        <div class="logo-ring">
            <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="48" cy="48" r="44" stroke="rgba(99,179,237,0.12)" stroke-width="1.5"/>
                <path d="M48 4 A44 44 0 0 1 92 48" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="92" cy="48" r="3.5" fill="#3b82f6"/>
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#3b82f6"/>
                        <stop offset="100%" stop-color="#8b5cf6"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="logo-inner">📶</div>
        </div>

        <div class="brand-name">HotspotNet</div>
        <div class="tagline">Menghubungkan kamu ke internet</div>

        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
        <div class="status-text">Memuat halaman login…</div>
    </div>

    <div class="bottom-links">
        <a href="login.html">Login</a>
        <span>·</span>
        <a href="register.html">Daftar</a>
        <span>·</span>
        <a href="admin.html">Admin</a>
    </div>

    <script>
        window.location.href = "/login.html";
    </script>
</body>
</html>
